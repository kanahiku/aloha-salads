# AstroWind plumbing (i18n, blog flags, UI). Client identity is NOT here.
# Edit src/config/site.ts for name, URL, GTM, and Search Console.

site:
  name: Your Company
  site: 'https://example.com'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Your Company
    template: '%s — Your Company'
  description: 'Replace this description from the client Figma / SEO brief.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Your Company
    images:
      - url: '~/assets/images/logo.webp'
        width: 1024
        height: 124
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleTagManager:
      id: ''
    googleAnalytics:
      id: null

ui:
  theme: 'light'
