site:
  name: R&C Roofing
  site: 'https://roofinspectionhawaii.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: mVkD6aA1QxxRzrvp1axFDrFNoyzDEuUHpNJiahPzRZI

# Default SEO metadata
metadata:
  title:
    default: R&C Roofing
    template: '%s — R&C Roofing'
  description: 'Professional roofing services including inspections, repairs, replacements, and insurance claim help. HAAG Certified. Serving homeowners, property managers, and contractors.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: R&C Roofing
    images:
      - url: '~/assets/images/logo.webp'
        width: 1024
        height: 124
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    # GTM container — leave empty on sites that do not use Tag Manager.
    # If GA4 is loaded inside GTM, keep googleAnalytics.id null to avoid double-counting.
    googleTagManager:
      id: GTM-WGVFVT5Z
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX" — only if GA4 is NOT fired from GTM

ui:
  theme: 'light' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
