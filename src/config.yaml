# AstroWind plumbing (i18n, blog flags, UI). Client identity is NOT here.
# Edit src/config/site.ts for name, URL, GTM, and Search Console.

site:
  name: Aloha Salads
  site: 'https://example.com'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Aloha Salads
    template: '%s | Aloha Salads'
  description: 'Island-grown produce, never-frozen local ahi, and bowls built the way you like them. Kailua-born since 2006 — six spots on O‘ahu.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Aloha Salads
    images:
      - url: '~/assets/images/og-image.jpg'
        width: 1200
        height: 630
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleTagManager:
      id: ''
    googleAnalytics:
      id: null

ui:
  theme: 'light'
